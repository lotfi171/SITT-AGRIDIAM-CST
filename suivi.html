<style>
:root{--navy:#1F3864;--yel:#FFFF00;--bg:#f4f6fa;--line:#d5dae3;--red:#c00000;--green:#1e7b34;--orange:#b45f06}

header{padding-top:calc(8px + env(safe-area-inset-top,0px))}

</style></head><body>
<div id="app">
<header>
  <img src="icon-192.png" alt="AGRIDIAM">
  <h1>Suivi des versements clients</h1><span id="saved" style="font-size:12px;color:#cfe3ff">💾 Enregistrement automatique</span>
</header>
<nav id="tabs"></nav>
<div class="bar noprint">
  <label>Année <select id="f-annee" onchange="state.annee=this.value;render()"></select></label>
  <input type="text" id="f-q" placeholder="Rechercher un client, T2, facture, banque…" oninput="state.q=this.value;render()" style="min-width:240px">
  <button class="btn sec" onclick="chargerTout()">Actualiser</button>
  <button class="btn sec" onclick="exporterExcel()">⬇️ Excel</button>
</div>
<main id="main"></main>
</div>
<div id="modal"><div class="box" id="modal-box"></div></div>
<div id="toast"></div>
<script>

/* ============ Outils ============ */
const LOGO="icon-192.png";
const nf=new Intl.NumberFormat('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt=x=>nf.format(Number(x)||0);
const r2=x=>Math.round((Number(x)||0)*100)/100;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fdate=d=>d?d.split('-').reverse().join('/'):'';
const $=id=>document.getElementById(id);
function toast(t,ms=3500){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',ms)}
function daysBetween(a,b){return Math.round((new Date(b)-new Date(a))/86400000)}
function normName(s){return String(s||'').toUpperCase().replace(/[^A-Z0-9 ]+/g,' ').replace(/\s+/g,' ').trim()}
function bigrams(s){const o=[];for(let i=0;i<s.length-1;i++)o.push(s.slice(i,i+2));return o}
function dice(a,b){if(a===b)return 1;if(a.length<2||b.length<2)return 0;const A=bigrams(a),B=bigrams(b);const m=new Map();A.forEach(x=>m.set(x,(m.get(x)||0)+1));let h=0;B.forEach(x=>{if(m.get(x)>0){h++;m.set(x,m.get(x)-1)}});return 2*h/(A.length+B.length)}
function sameName(a,b){
  a=normName(a);b=normName(b);if(!a||!b)return false;if(a===b)return true;
  const ta=a.split(' ').filter(w=>w.length>=4),tb=b.split(' ').filter(w=>w.length>=4);
  if(ta.length&&tb.length){const sa=new Set(ta),sb=new Set(tb);const inter=ta.filter(w=>sb.has(w)).length;
    if(inter>=1&&(inter===sa.size||inter===sb.size))return true}
  return dice(a,b)>=0.86;
}
const TYPES={exact_nom:'Nom + montant exact',exact_montant:'Montant exact',partiel:'Versement partiel',cumul:'Plusieurs entrées du même nom',combinaison:'Plusieurs clients',avant_entree:"Versement avant l'entrée",manuel:'Manuel'};

/* ============ Données (Supabase, avec la connexion du site) ============ */
const state={tab:'clients',annee:'all',q:'',client:null,E:[],D:[],L:[],proposals:[]};
const DB_NAME='agridiam-suivi-v1';
let LDB=null,memOnly=false;
function emptyDB(){return {suivi_entrees:[],suivi_versements:[],suivi_liens:[],seq:{suivi_entrees:1,suivi_versements:1,suivi_liens:1}}}
function idbOpen(){return new Promise((res,rej)=>{const q=indexedDB.open(DB_NAME,1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function kv(mode,fn){const d=await idbOpen();return new Promise((res,rej)=>{const t=d.transaction('kv',mode);const r=fn(t.objectStore('kv'));t.oncomplete=()=>{d.close();res(r&&r.result)};t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})}
const kvGet=k=>kv('readonly',s=>s.get(k));
const kvPut=(k,v)=>kv('readwrite',s=>s.put(v,k));
const kvDel=k=>kv('readwrite',s=>s.delete(k));
const kvKeys=()=>kv('readonly',s=>s.getAllKeys());
function setSaved(ok){const e=$('saved');if(!e)return;if(ok){const d=new Date();e.style.color='#cfe3ff';e.textContent='💾 Enregistré '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}else{e.style.color='#ffb4a9';e.textContent="⚠️ Enregistrement impossible : fais une sauvegarde (fichier)"}}
let saveChain=Promise.resolve();
function persist(){
  const json=JSON.stringify(LDB);
  saveChain=saveChain.then(async()=>{
    if(memOnly){setSaved(false);return}
    try{
      await kvPut('data',json);
      const day=new Date().toISOString().slice(0,10);
      if(await kvGet('bk-'+day)===undefined){
        await kvPut('bk-'+day,json);
        const ks=(await kvKeys()).filter(k=>String(k).startsWith('bk-')).sort();
        for(const k of ks.slice(0,Math.max(0,ks.length-14)))await kvDel(k);
      }
      setSaved(true);
    }catch(e){setSaved(false)}
  });
  return saveChain;
}
function seedFrom(J){
  const D=emptyDB();
  J.entrees.forEach(e=>D.suivi_entrees.push(Object.assign({id:D.seq.suivi_entrees++},e)));
  J.versements.forEach(v=>D.suivi_versements.push(Object.assign({id:D.seq.suivi_versements++},v)));
  const ke=new Map(D.suivi_entrees.map(e=>[e.annee+'/'+e.ligne,e.id])),kd=new Map(D.suivi_versements.map(v=>[v.annee+'/'+v.ligne,v.id]));
  J.liens.forEach(l=>{const a=ke.get(l.e.join('/')),b=kd.get(l.v.join('/'));if(a&&b)D.suivi_liens.push({id:D.seq.suivi_liens++,entree_id:a,versement_id:b,montant:l.montant,type:l.type,a_verifier:l.a_verifier})});
  return D;
}
async function loadLocal(){
  try{const raw=await kvGet('data');if(raw){LDB=JSON.parse(raw);try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}setSaved(true);return}}catch(e){memOnly=true}
  LDB=seedFrom(window.SUIVI_SEED||{entrees:[],versements:[],liens:[]});
  if(!memOnly){try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}await persist()}else setSaved(false);
}
async function rest(method,path,body,prefer){
  const [t,qs]=path.split('?');const q=new URLSearchParams(qs||'');const T=LDB[t];
  if(!T)throw new Error('table inconnue '+t);
  if(method==='GET'){const lim=+q.get('limit')||1000,off=+q.get('offset')||0;return T.slice().sort((a,b)=>a.id-b.id).slice(off,off+lim).map(x=>Object.assign({},x))}
  if(method==='POST'){
    const rows=Array.isArray(body)?body:[body],oc=q.get('on_conflict');
    for(const r of rows){const ex=oc?T.find(x=>x.annee===r.annee&&x.ligne===r.ligne):null;if(ex)Object.assign(ex,r);else T.push(Object.assign({id:LDB.seq[t]++},r))}
  }else if(method==='PATCH'){const id=+q.get('id').replace('eq.','');const x=T.find(y=>y.id===id);if(x)Object.assign(x,body)}
  else if(method==='DELETE'){const v=q.get('id');if(v.startsWith('gt.'))T.length=0;else{const id=+v.replace('eq.','');const i=T.findIndex(y=>y.id===id);if(i>=0)T.splice(i,1)}}
  await persist();return null;
}
async function fetchAll(table){
  let out=[],off=0;
  while(true){const rows=await rest('GET',`${table}?select=*&order=id.asc&limit=1000&offset=${off}`);out=out.concat(rows);if(rows.length<1000)break;off+=1000}
  return out;
}
let scanCount=new Map();
async function chargerScans(){
  scanCount=new Map();
  try{
    const rows=await new Promise((res,rej)=>{const q=indexedDB.open('agridiam-scans-v1',1);q.onupgradeneeded=()=>q.result.createObjectStore('scans',{keyPath:'id'});
      q.onsuccess=()=>{const d=q.result;const r=d.transaction('scans').objectStore('scans').getAll();r.onsuccess=()=>{d.close();res(r.result)};r.onerror=()=>rej(r.error)};q.onerror=()=>rej(q.error)});
    rows.filter(r=>r.mod==='suivi').forEach(r=>{const m=String(r.label||'').match(/(\d{4})\/(\d+)/);if(m){const k=m[1]+'/'+m[2];scanCount.set(k,(scanCount.get(k)||0)+1)}});
  }catch(e){}
}
async function chargerTout(){
  try{
    const [E,D,L]=await Promise.all([fetchAll('suivi_entrees'),fetchAll('suivi_versements'),fetchAll('suivi_liens')]);
    E.sort((a,b)=>(a.date||'').localeCompare(b.date||'')||a.annee-b.annee||a.ligne-b.ligne);
    D.sort((a,b)=>(a.date||'').localeCompare(b.date||'')||a.annee-b.annee||a.ligne-b.ligne);
    state.E=E;state.D=D;state.L=L;await chargerScans();indexer();majAnnees();render();
  }catch(e){toast('Erreur de chargement : '+(e.message||e)+'',8000);render()}
}
let Em=new Map(),Dm=new Map(),LbyE=new Map(),LbyD=new Map();
function indexer(){
  Em=new Map(state.E.map(e=>[e.id,e]));Dm=new Map(state.D.map(d=>[d.id,d]));
  LbyE=new Map();LbyD=new Map();
  state.L.forEach(l=>{(LbyE.get(l.entree_id)||LbyE.set(l.entree_id,[]).get(l.entree_id)).push(l);(LbyD.get(l.versement_id)||LbyD.set(l.versement_id,[]).get(l.versement_id)).push(l)});
  state.E.forEach(e=>{e.verse=r2((LbyE.get(e.id)||[]).reduce((s,l)=>s+Number(l.montant),0));e.reste=r2(e.montant-e.verse);e.statut=e.reste<=0.004?'V':(e.verse>0?'P':'R')});
  state.D.forEach(d=>{d.relie=r2((LbyD.get(d.id)||[]).reduce((s,l)=>s+Number(l.montant),0));d.nonrel=r2(d.montant-d.relie)});
}
function majAnnees(){
  const ys=[...new Set(state.E.map(e=>e.annee).concat(state.D.map(d=>d.annee)))].sort();
  const s=$('f-annee');s.innerHTML='<option value="all">Toutes</option>'+ys.map(y=>`<option value="${y}">${y}</option>`).join('');s.value=state.annee;
}
const okAnnee=a=>state.annee==='all'||String(a)===String(state.annee);
const okQ=(...t)=>{const q=normName(state.q);return !q||normName(t.join(' ')).includes(q)};

/* ============ Onglets ============ */
const TABS=[['clients','Clients'],['entrees','Entrées'],['versements','Versements'],['verif','À vérifier'],['auto','Rapprocher'],['import','Importer']];
function render(){
  $('tabs').innerHTML=TABS.map(([k,t])=>`<button class="${state.tab===k?'on':''}" onclick="state.tab='${k}';state.client=null;render()">${t}</button>`).join('');
  const f={clients:vClients,entrees:vEntrees,versements:vVersements,verif:vVerif,auto:vAuto,import:vImport}[state.tab];
  $('main').innerHTML='<div class="printhead"><img src="'+LOGO+'"><b>SARL AGRIDIAM : suivi des versements</b></div>'+f();
  if(state.tab==='import')listBackups();
}
const tagS=s=>s==='V'?'<span class="tag t-v">VERSÉ</span>':s==='P'?'<span class="tag t-p">PARTIEL</span>':'<span class="tag t-r">RESTE</span>';

/* ---- Clients ---- */
function vClients(){
  if(state.client)return vClientDetail();
  const m=new Map();
  state.E.filter(e=>okAnnee(e.annee)&&okQ(e.remettant,e.t2,e.facture)).forEach(e=>{
    const c=m.get(e.remettant)||{n:e.remettant,nb:0,tot:0,verse:0,reste:0};
    c.nb++;c.tot+=e.montant;c.verse+=e.verse;c.reste+=e.reste;m.set(e.remettant,c)});
  const rows=[...m.values()].sort((a,b)=>b.reste-a.reste);
  const T=rows.reduce((s,c)=>({tot:s.tot+c.tot,verse:s.verse+c.verse,reste:s.reste+c.reste}),{tot:0,verse:0,reste:0});
  return `<div class="cards"><div class="card">Total entrées<b>${fmt(T.tot)}</b></div><div class="card">Versé<b>${fmt(T.verse)}</b></div><div class="card">Reste à verser<b>${fmt(T.reste)}</b></div></div>
  <div class="tw"><table><tr><th>Client (remettant)</th><th class="num">Entrées</th><th class="num">Total</th><th class="num">Versé</th><th class="num">RESTE</th></tr>
  ${rows.map(c=>`<tr class="click" onclick="state.client=${JSON.stringify(c.n).replace(/"/g,'&quot;')};render()"><td>${esc(c.n)}</td><td class="num">${c.nb}</td><td class="num">${fmt(c.tot)}</td><td class="num">${fmt(c.verse)}</td><td class="num yel">${fmt(c.reste)}</td></tr>`).join('')}
  <tr><td><b>TOTAL</b></td><td></td><td class="num"><b>${fmt(T.tot)}</b></td><td class="num"><b>${fmt(T.verse)}</b></td><td class="num yel">${fmt(T.reste)}</td></tr></table></div>`;
}
function vClientDetail(){
  const es=state.E.filter(e=>e.remettant===state.client&&okAnnee(e.annee));
  const tot=es.reduce((s,e)=>s+e.montant,0),res=es.reduce((s,e)=>s+e.reste,0);
  return `<p class="noprint"><button class="btn sec" onclick="state.client=null;render()">← Tous les clients</button></p>
  <h3 style="color:var(--navy)">${esc(state.client)}</h3>
  <div class="cards"><div class="card">Entrées<b>${fmt(tot)}</b></div><div class="card">Versé<b>${fmt(tot-res)}</b></div><div class="card">Reste<b>${fmt(res)}</b></div></div>
  <div class="tw"><table><tr><th>Année / ligne</th><th>Date</th><th>T2 (facture)</th><th>N° facture</th><th class="num">Montant</th><th>Statut</th><th>Versements (date, banque, montant, délai)</th><th class="num">Reste</th></tr>
  ${es.map(e=>`<tr><td>${e.annee} / ${e.ligne}</td><td>${fdate(e.date)}</td><td>${esc(e.t2)}</td><td>${esc(e.facture)}</td><td class="num">${fmt(e.montant)}</td><td>${tagS(e.statut)}</td><td>${lienTxt(e)}</td><td class="num yel">${fmt(e.reste)}</td></tr>`).join('')}</table></div>`;
}
function lienTxt(e){
  return (LbyE.get(e.id)||[]).map(l=>{const d=Dm.get(l.versement_id);if(!d)return '';
    return `<div>${fdate(d.date)} · ${esc(d.banque)} · <b>${fmt(l.montant)}</b> · ${daysBetween(e.date,d.date)} j ${l.a_verifier?'<span class="tag chk">à vérifier</span>':''}</div>`}).join('');
}

/* ---- Entrées ---- */
function vEntrees(){
  const fs=state.fStat||'all';
  const rows=state.E.filter(e=>okAnnee(e.annee)&&okQ(e.remettant,e.t2,e.facture)&&(fs==='all'||(fs==='RP'?e.statut!=='V':e.statut===fs)));
  return `<div class="bar noprint" style="padding-left:0"><select onchange="state.fStat=this.value;render()">
   ${[['all','Tous les statuts'],['RP','Reste ou partiel'],['R','Reste seulement'],['P','Partiel'],['V','Versé']].map(([v,t])=>`<option value="${v}" ${fs===v?'selected':''}>${t}</option>`).join('')}</select>
   <span class="small">${rows.length} lignes, reste ${fmt(rows.reduce((s,e)=>s+e.reste,0))}</span></div>
  <div class="tw"><table><tr><th>Année / ligne</th><th>Date</th><th>Client</th><th>T2</th><th>Facture</th><th class="num">Montant</th><th>Statut</th><th>Versements</th><th class="num">Reste</th><th class="noprint"></th></tr>
  ${rows.map(e=>`<tr><td>${e.annee} / ${e.ligne}</td><td>${fdate(e.date)}</td><td>${esc(e.remettant)}</td><td>${esc(e.t2)}</td><td>${esc(e.facture)}</td><td class="num">${fmt(e.montant)}</td><td>${tagS(e.statut)}</td><td>${lienTxt(e)}</td><td class="num yel">${fmt(e.reste)}</td><td class="noprint">${e.reste>0.004?`<button class="btn sm" onclick="modalEntree(${e.id})">Relier</button>`:''}</td></tr>`).join('')}</table></div>`;
}

/* ---- Versements ---- */
function vVersements(){
  const fs=state.fVers||'all';
  const rows=state.D.filter(d=>okAnnee(d.annee)&&okQ(d.nom,d.banque)&&(fs==='all'||(fs==='NR'?d.nonrel>0.004:d.nonrel<=0.004)));

   ${[['all','Tous les versements'],['NR','Sans origine (non reliés)'],['OK','Reliés']].map(([v,t])=>`<option value="${v}" ${fs===v?'selected':''}>${t}</option>`).join('')}</select>

/* ---- Rapprochement automatique ---- */
function combos(items,A,key,maxN,cap){
  items=items.slice(-cap);let best=null;
  function rec(start,n,sum,pick){
    if(best)return;
    if(Math.abs(sum-A)<0.005&&pick.length===n){best=pick.slice();return}
    if(pick.length>=n)return;
    for(let i=start;i<items.length;i++){const v=key(items[i]);if(sum+v>A+0.005)continue;pick.push(items[i]);rec(i+1,n,sum+v,pick);pick.pop();if(best)return}
  }
  for(let n=1;n<=maxN&&!best;n++)rec(0,n,0,[]);
  return best;
}
function exactCombo(pool,A,rem){
  // groupes par client + jour (une visite), puis lignes seules
  const g=new Map();pool.forEach(e=>{const k=e.remettant+'|'+e.date;(g.get(k)||g.set(k,[]).get(k)).push(e)});
  const units=[...g.values()].map(items=>({items,s:r2(items.reduce((s,e)=>s+rem.get(e.id),0))}));
  let b=combos(units.filter(u=>u.items.length>1),A,u=>u.s,1,40);if(b)return b[0].items.map(e=>({e,m:rem.get(e.id)}));
  b=combos(pool,A,e=>rem.get(e.id),1,60);if(b)return b.map(e=>({e,m:rem.get(e.id)}));
  b=combos(units,A,u=>u.s,4,20);if(b)return b.flatMap(u=>u.items).map(e=>({e,m:rem.get(e.id)}));
  b=combos(pool,A,e=>rem.get(e.id),3,18);if(b)return b.map(e=>({e,m:rem.get(e.id)}));
  return null;
}
function autoMatch(years){
  const rem=new Map(state.E.map(e=>[e.id,e.reste])),non=new Map(state.D.map(d=>[d.id,d.nonrel]));
  const out=[];
  const deps=state.D.filter(d=>non.get(d.id)>0.004&&years.includes(String(d.annee))).sort((a,b)=>(a.date||'').localeCompare(b.date||'')||a.ligne-b.ligne);
  for(const d of deps){
    const A=non.get(d.id);
    const avail=state.E.filter(e=>rem.get(e.id)>0.004&&e.date&&d.date&&e.date<=d.date);
    const nm=avail.filter(e=>sameName(d.nom,e.t2)||sameName(d.nom,e.remettant));
    let sol=null,type='',chk=false;
    if(d.nom&&nm.length){sol=exactCombo(nm,A,rem);type='exact_nom'}
    if(!sol){const win=avail.filter(e=>daysBetween(e.date,d.date)<=35);sol=exactCombo(win,A,rem);type='exact_montant';chk=!!sol&&!d.nom?false:!!sol}
    if(!sol&&nm.length){const one=nm.find(e=>rem.get(e.id)>=A-0.004);if(one){sol=[{e:one,m:A}];type='partiel';chk=true}}
    if(!sol&&nm.length&&nm.reduce((s,e)=>s+rem.get(e.id),0)>=A-0.004){let left=A;sol=[];for(const e of nm){const t=Math.min(rem.get(e.id),left);sol.push({e,m:r2(t)});left=r2(left-t);if(left<=0.004)break}type='cumul';chk=true}
    if(sol){sol.forEach(x=>rem.set(x.e.id,r2(rem.get(x.e.id)-x.m)));non.set(d.id,0);out.push({d,sol,type,chk,ok:true})}
  }
  return out;
}

function parseDateCell(v,year){
  if(v instanceof Date){return new Date(Date.UTC(year,v.getMonth(),v.getDate()))}
  if(typeof v==='string'){let m=v.trim().match(/^(\d{1,2})\D+(\d{1,2})\D+(\d{4})$/);if(m)return new Date(Date.UTC(year,+m[2]-1,+m[1]));m=v.trim().match(/^(\d{2})(\d{2})\/(\d{4})$/);if(m)return new Date(Date.UTC(year,+m[2]-1,+m[1]))}
  return null;
}
async function importXlsx(){
  const f=$('f-xls').files[0];if(!f)return toast('Choisir un fichier Excel');
  const year=parseInt($('x-annee').value);
  try{
    const wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true});
    const ws=wb.Sheets[wb.SheetNames[0]];const R0=XLSX.utils.decode_range(ws['!ref']).s.r;const A=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null});
    let hr=-1;for(let i=0;i<15;i++){if((A[i]||[]).some(c=>/REMETTANT/i.test(String(c||''))))hr=i}
    if(hr<0)throw new Error('Ligne « REMETTANT » introuvable');
    const find=(rx,from,to)=>{for(let i=from;i<=to;i++){const r=A[i]||[];for(let c=0;c<r.length;c++)if(rx.test(String(r[c]||'')))return c}return -1};
    const cR=find(/REMETTANT/i,hr,hr),cT=find(/^T2/i,hr,hr),cD=find(/^date/i,0,hr),cE=find(/entr/i,0,hr),cS=find(/sortie/i,0,hr),cK=find(/remarque/i,0,hr);
    if([cR,cD,cE,cS].some(c=>c<0))throw new Error('Colonnes Date / Entrée / Sortie introuvables');
    const ents=[],deps=[];let last=new Date(Date.UTC(year,0,1));
    for(let i=hr+1;i<A.length;i++){
      const r=A[i]||[];const rem=String(r[cR]||'').replace(/\s+/g,' ').trim(),t2=String(r[cT]||'').replace(/\s+/g,' ').trim();
      if(/^(SOLDE|MOIS|MOI |TOTAL)/i.test(rem)||/^(SOLDE|MOIS|MOI |TOTAL)/i.test(t2))continue;
      const e=typeof r[cE]==='number'?r[cE]:0,s=typeof r[cS]==='number'?r[cS]:0;if(!e&&!s)continue;
      const d=parseDateCell(r[cD],year)||last;last=d;const iso=d.toISOString().slice(0,10);
      if(e)ents.push({annee:year,ligne:i+R0+1,date:iso,remettant:rem.replace(/[\s\/\-]+$/,'').toUpperCase()||t2.toUpperCase(),t2:t2.toUpperCase(),facture:cK>=0?String(r[cK]||'').toUpperCase():'',montant:r2(e)});
      if(s)deps.push({annee:year,ligne:i+R0+1,date:iso,banque:rem.toUpperCase(),nom:t2.toUpperCase(),montant:r2(s)});
    }
    await upsertBatch('suivi_entrees',ents,'annee,ligne');await upsertBatch('suivi_versements',deps,'annee,ligne');
    logI(`Terminé : ${ents.length} entrées, ${deps.length} versements pour ${year}`);toast('Import terminé');await chargerTout();state.tab='import';render();
  }catch(e){logI('ERREUR : '+(e.message||e));toast('Erreur d\'import',5000)}
}

/* ============ Démarrage ============ */
window.addEventListener('load',async()=>{
  $('modal').addEventListener('click',e=>{if(e.target.id==='modal')fermer()});
  try{await loadLocal();await chargerTout()}catch(e){toast('Erreur de démarrage : '+(e.message||e),8000)}
});
